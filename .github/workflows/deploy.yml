name: Build API image

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  packages: write # allows pushing the image to GitHub's registry

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Registry image names must be lowercase.
          tags: |
            ghcr.io/ayeshan-oshitha/portfolio-api:latest
            ghcr.io/ayeshan-oshitha/portfolio-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
